name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK to InkyNerd.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/InkyNerd.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkyNerd
          path: app/build/outputs/apk/debug/InkyNerd.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-${{ github.run_number }}
          name: InkyNerd v0.1.${{ github.run_number }}
          files: app/build/outputs/apk/debug/InkyNerd.apk
